<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paris & Disney Trip Checklist</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <header class="header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path
                    d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"
                    fill="currentColor" />
            </svg>
            <h1>Travel Checklist</h1>
            <button class="clear-btn" onclick="clearChecklist()">Clear All</button>
        </header>

        <div class="controls-card">
            <div class="toggle-group">
                <span class="toggle-label">Season:</span>
                <button id="btn-winter" class="toggle-btn active" onclick="setSeason('winter')">Winter</button>
                <button id="btn-summer" class="toggle-btn" onclick="setSeason('summer')">Summer</button>
            </div>
            <div class="toggle-group">
                <span class="toggle-label">Military Gear:</span>
                <button id="btn-mil-off" class="toggle-btn active" onclick="setMilitary(false)">Off</button>
                <button id="btn-mil-on" class="toggle-btn" onclick="setMilitary(true)">On</button>
            </div>
        </div>

        <section class="checklist">
            <h2>1. DOCUMENTS AND MONEY</h2>
            <div class="item"><label><input type="checkbox"> Passports</label></div>
            <div class="item"><label><input type="checkbox"> Driving License</label></div>
            <div class="item"><label><input type="checkbox"> Credit Cards</label></div>
            <div class="item"><label><input type="checkbox"> Cash / Money</label></div>
            <div class="item"><label><input type="checkbox"> Euro Coins (For toilets/carousels)</label></div>
            <div class="item"><label><input type="checkbox"> Travel Insurance</label></div>
            <div class="item"><label><input type="checkbox"> Leave Approval from work</label></div>
            <div class="item"><label><input type="checkbox"> Navigo Cards</label></div>
            <div class="item"><label><input type="checkbox"> Electronic copies of Key Documents</label></div>
        </section>

        <section class="checklist">
            <h2>2. CLOTHING AND ACCESSORIES</h2>
            <div class="item"><label><input type="checkbox"> Underwear</label></div>
            <div class="item"><label><input type="checkbox"> Socks</label></div>
            <div class="item"><label><input type="checkbox"> Shirts / T-shirts</label></div>
            <div class="item"><label><input type="checkbox"> Pants / Jeans</label></div>
            <div class="item"><label><input type="checkbox"> Belt</label></div>
            <div class="item"><label><input type="checkbox"> Sleepwear</label></div>
            <div class="item"><label><input type="checkbox"> Sunglasses</label></div>
            <div class="item"><label><input type="checkbox"> Towel</label></div>

            <div class="item season-winter"><label><input type="checkbox"> Longline Waterproof Coat</label></div>
            <div class="item season-winter"><label><input type="checkbox"> Thermal Tops/Leggings</label>
            </div>
            <div class="item season-winter"><label><input type="checkbox"> Sweaters / Fleece Tops</label></div>
            <div class="item season-winter"><label><input type="checkbox"> Woolen Hat & Scarf</label></div>
            <div class="item season-winter"><label><input type="checkbox"> Gloves</label></div>
            <div class="item season-winter"><label><input type="checkbox"> Walking Boots (Waterproof)</label></div>

            <div class="item season-summer"><label><input type="checkbox"> Swimsuits</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Flip Flops</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Hats</label></div>
        </section>

        <section class="checklist">
            <h2>3. TOILETRIES</h2>
            <div class="item"><label><input type="checkbox"> Toothbrush & Toothpaste</label></div>
            <div class="item"><label><input type="checkbox"> Deodorant</label></div>
            <div class="item"><label><input type="checkbox"> Shaver / Hair Wax</label></div>
            <div class="item"><label><input type="checkbox"> Nail Clippers</label></div>
            <div class="item"><label><input type="checkbox"> Shampoo, Conditioner, Body Wash</label></div>
            <div class="item"><label><input type="checkbox"> Shower Sponge</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Sunscreen</label></div>
            <div class="item season-winter"><label><input type="checkbox"> Lip Balm & Moisturizer</label></div>
        </section>

        <section class="checklist">
            <h2>4. FOR THE KID / DISNEY</h2>
            <div class="item"><label><input type="checkbox"> Stroller + Rain Cover + Warm Blanket</label></div>
            <div class="item"><label><input type="checkbox"> Tablet + volume-limited headphones</label></div>
            <div class="item"><label><input type="checkbox"> Favourite snacks</label></div>
            <div class="item"><label><input type="checkbox"> Water Bottle</label></div>
            <div class="item"><label><input type="checkbox"> Change of Clothes (Thermal vests)</label></div>
            <div class="item"><label><input type="checkbox"> Hand Warmers</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Beach Toys</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Swim Jacket</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Goggles</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Sunscreen</label></div>
        </section>

        <section class="checklist">
            <h2>5. ELECTRONICS</h2>
            <div class="item"><label><input type="checkbox"> Mobile Phones + Power Bank</label>
            </div>
            <div class="item"><label><input type="checkbox"> SIM Card / eSIM / Internet</label></div>
            <div class="item"><label><input type="checkbox"> Airtags & Airpods</label></div>
            <div class="item"><label><input type="checkbox"> Chargers & Electric Adapters</label></div>
            <div class="item"><label><input type="checkbox"> Apple Watch + Charger</label></div>
            <div class="item"><label><input type="checkbox"> Laptop</label></div>
        </section>

        <section class="checklist">
            <h2>6. HEALTH</h2>
            <div class="item"><label><input type="checkbox"> Panadol / Solpadeine</label></div>
            <div class="item"><label><input type="checkbox"> Mustella / Rash cream</label></div>
            <div class="item"><label><input type="checkbox"> Prescription Medications</label></div>
            <div class="item"><label><input type="checkbox"> Motion-sickness tabs</label></div>
            <div class="item"><label><input type="checkbox"> Band-Aids & Hand Sanitizer</label></div>
            <div class="item"><label><input type="checkbox"> Tissues</label></div>
            <div class="item season-summer"><label><input type="checkbox"> Insect Repellent</label></div>
            <div class="item season-summer"><label><input type="checkbox"> After-sun/aloë gel + SPF lip balm</label>
            </div>
        </section>

        <section class="checklist">
            <h2>7. MISCELLANEOUS</h2>
            <div class="item season-winter"><label><input type="checkbox"> Compact Umbrella / Rain Poncho</label></div>
            <div class="item"><label><input type="checkbox"> Travel Pillow / Neck Cushion</label></div>
            <div class="item"><label><input type="checkbox"> Reusable Water Bottles</label></div>
            <div class="item"><label><input type="checkbox"> Car Phone Holder</label></div>
            <div class="item"><label><input type="checkbox"> Ziplock bags (For dry clothes)</label></div>
            <div class="item"><label><input type="checkbox"> Travel Laundry Bag / Wet Bags</label></div>
            <div class="item"><label><input type="checkbox"> Baby Monitor</label></div>
        </section>

        <section class="checklist">
            <h2>8. PREPARE YOUR HOME</h2>
            <div class="item"><label><input type="checkbox"> Care of Pets, Lawn, and Plants</label></div>
            <div class="item"><label><input type="checkbox"> Unplug Appliances</label></div>
            <div class="item"><label><input type="checkbox"> Photograph Luggage Contents</label></div>
            <div class="item"><label><input type="checkbox"> Close Gas Bottle</label></div>
            <div class="item"><label><input type="checkbox"> Leave House Key</label></div>
        </section>

        <section class="checklist mode-military">
            <h2>9. MILITARY GEAR FOR AVIATOR PILOT</h2>
            <div class="item"><label><input type="checkbox"> Mission order</label></div>
            <div class="item"><label><input type="checkbox"> Multicam uniform</label></div>
            <div class="item"><label><input type="checkbox"> Beret & Belt</label></div>
            <div class="item"><label><input type="checkbox"> Dog Tags</label></div>
            <div class="item"><label><input type="checkbox"> Flight Suit / Flight Jacket</label></div>
            <div class="item"><label><input type="checkbox"> Pilot Helmet & Gloves</label></div>
            <div class="item"><label><input type="checkbox"> Aviator Boots & Socks</label></div>
            <div class="item"><label><input type="checkbox"> Green/Beige T-shirts</label></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
